<!DOCTYPE html>
<html lang="ru" class="boot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Prompt Forge">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Prompt Forge 2.0 — генератор промтов для Stable Diffusion</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%236c5ce7'/%3E%3Cpath fill='white' d='M50 20 61 40 85 44 67 62 71 86 50 75 29 86 33 62 15 44 39 40Z'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>
  // Тема применяется до отрисовки, чтобы не было вспышки
  try {
    document.documentElement.dataset.theme = localStorage.getItem('prompt_forge_theme') ||
      (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  } catch (e) { document.documentElement.dataset.theme = 'dark'; }
</script>
</head>
<body>
<div class="bg"></div>
<main class="container">
  <header class="head">
    <div class="brand"><h1>✦ Prompt Forge</h1><span class="ver">v2.0</span></div>
    <button id="theme" class="pill" aria-label="Сменить тему"></button>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab active" role="tab" data-tab="gen" aria-selected="true">Генератор</button>
    <button class="tab" role="tab" data-tab="favs" aria-selected="false">Избранное <span id="favcount" class="count">0</span></button>
    <span class="ink" aria-hidden="true"></span>
  </nav>

  <section id="gen" class="panel active">
    <div class="layout">
      <div>
        <label for="idea">Ваша идея</label>
        <input id="idea" type="text" autocomplete="off" placeholder="Например: cyberpunk cat on a rainy street">
        <p id="hint" class="hint" hidden>Stable Diffusion лучше понимает английский. <button id="translate" class="link">Перевести через Duck.ai</button></p>
        <div id="examples" class="chips" aria-label="Примеры идей"></div>

        <div class="card">
          <div class="grid">
            <div><label for="style">Стиль</label><select id="style"></select></div>
            <div><label for="ratio">Соотношение сторон</label><select id="ratio"></select></div>
            <div><label for="model">Модель</label>
              <select id="model"><option value="sdxl">SDXL</option><option value="sd15">SD 1.5</option></select></div>
          </div>
          <span id="mods-l" class="label">Дополнения</span>
          <div id="mods" class="chips" role="group" aria-labelledby="mods-l"></div>
          <label for="neg">Negative prompt</label>
          <input id="neg" type="text" autocomplete="off" placeholder="Пусто — подставится стандартный набор">
        </div>
        <button id="rand" class="btn primary wide">🎲 Случайный промт</button>
      </div>

      <aside class="card result">
        <div class="row first">
          <h2>Готовый промт</h2>
          <div>
            <button id="share" class="icon" hidden title="Поделиться" aria-label="Поделиться">📤</button>
            <button id="export" class="icon" data-needs title="Скачать .txt" aria-label="Скачать .txt">💾</button>
            <button id="star" class="icon" data-needs title="В избранное" aria-label="В избранное">☆</button>
          </div>
        </div>
        <div class="row"><span class="label">Positive</span><button id="copy-pos" class="btn sm" data-needs>Копировать</button></div>
        <pre id="pos" aria-live="polite"></pre>
        <div class="row"><span class="label">Negative</span><button id="copy-neg" class="btn sm" data-needs>Копировать</button></div>
        <pre id="neg-out"></pre>
        <div class="row"><span class="label">Параметры генерации</span>
          <div class="btns"><button id="seed-btn" class="btn sm" title="Новый seed">🎲 Seed</button><button id="copy-all" class="btn sm" data-needs title="Промт, negative и параметры в формате Automatic1111">Копировать всё</button></div></div>
        <div id="res" class="params"></div>
        <div class="links">
          <a href="https://duck.ai/" target="_blank" rel="noopener">Duck.ai</a>
          <a href="https://gemini.google.com/" target="_blank" rel="noopener">Google Gemini</a>
        </div>
      </aside>
    </div>
  </section>

  <section id="favs" class="panel">
    <div class="row first"><h2>Сохранённые промты</h2><button id="clear" class="btn sm danger">Очистить всё</button></div>
    <div id="favlist" class="favlist"></div>
  </section>
</main>
<button id="fab" class="fab" hidden>Копировать промт</button>
<div id="toast" role="status" aria-live="polite"></div>
<script src="script.js"></script>
</body>
</html>
